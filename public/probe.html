<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Browser handoff</title>
  <link rel="stylesheet" href="/probe/novnc/assets/probe.css">
  <script type="module" src="/probe/novnc/assets/probe.js"></script>
</head>
<body>
  <main id="viewport" aria-label="Remote browser"><div id="stage"><section id="screen" aria-label="Browser display"></section></div></main>
  <svg id="pointer" viewBox="0 0 15 21" width="15" height="21" aria-hidden="true" hidden><path d="M1.5 1.5v15.2l3.7-3.5 2.6 6.1 2.6-1.1-2.6-6h5.1z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <header id="bar" aria-label="Browser controls">
    <div class="bar-row">
      <div id="bar-left"><span id="bar-status" role="img" aria-label="Watching" data-state="watching"><svg id="icon-watching" class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg id="icon-control" class="ico" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M9.5 9.5l4 10.5 1.7-4.4 4.3-1.8z"/><path d="M5 5l2 2M9.5 2.5V5.5M2.5 9.5H5.5M14 5l-2 2"/></svg></span></div>
      <div id="bar-center"><button id="control" class="txt go" type="button" disabled>Take control</button><div id="input-mode" role="radiogroup" aria-label="Input mode" hidden><button id="mode-touch" class="seg-btn" type="button" role="radio" aria-checked="true" aria-label="Touch"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 12V5.2a2 2 0 0 1 4 0V12M14 10.4a2 2 0 0 1 4 .4V16a6 6 0 0 1-6 6h-.8A6 6 0 0 1 6 19.2L4 15.2a2 2 0 0 1 3.2-2L10 16"/></svg></button><button id="mode-trackpad" class="seg-btn" type="button" role="radio" aria-checked="false" aria-label="Trackpad" tabindex="-1"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9.5l6 2.4-2.6 1-1 2.6z"/></svg></button></div></div>
      <div id="bar-right"><button id="keyboard" class="ib" type="button" disabled aria-pressed="false" aria-label="Keyboard" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2.4"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 15h10"/></svg></button><button id="more" class="ib" type="button" aria-label="More controls" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h.01M12 12h.01M18 12h.01" stroke-width="3.2"/></svg></button><button id="done" class="txt" type="button">Done</button></div>
    </div>
    <div id="more-sheet" hidden><div class="sheet-row"><button id="zoom-out" class="ib" type="button" aria-label="Zoom out"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6"/></svg></button><output id="zoom-level" aria-live="polite">Fit</output><button id="zoom-in" class="ib" type="button" aria-label="Zoom in"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6M10.5 7.5v6"/></svg></button><button id="zoom-toggle" class="ib" type="button" aria-label="Actual size"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><span class="sheet-gap"></span><button id="copy" class="ib" type="button" aria-label="Copy" title="Copy the current selection from the browser to this device" disabled><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button><button id="paste" class="ib" type="button" aria-label="Paste" title="Paste this device’s clipboard into the focused browser field" disabled><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 4h6v3H9z"/></svg></button></div><p id="hint">Swipe to scroll · pinch to zoom · hold, then drag</p></div>
  </header>
  <button id="bar-tab" type="button" aria-label="Show controls" hidden><span class="tab-shape"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span></button>
  <p id="status" role="status" aria-live="polite">Authenticating…</p>
  <p id="trackpad-hint" aria-live="polite" hidden>Slide to move the pointer. Tap to click. Two‑finger tap to right‑click.</p>
  <div id="quick-actions" hidden><button id="quick-copy" type="button" title="Copy the selected text to this device" hidden>Copy</button><button id="quick-paste" type="button" title="Paste this device’s clipboard into the focused field" hidden>Paste</button></div>
  <dialog id="clipboard-dialog" aria-labelledby="clipboard-title"><form method="dialog"><div class="clipboard-content"><h2 id="clipboard-title">Clipboard</h2><p id="clipboard-help"></p><textarea id="clipboard-text" aria-label="Clipboard text" rows="6" spellcheck="false"></textarea></div><div class="actions clipboard-actions"><button id="clipboard-send" type="button">Paste into browser</button><button type="submit">Close</button></div></form></dialog>
  <textarea id="keyboard-input" aria-label="Remote keyboard input" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" tabindex="-1"></textarea>
</body>
</html>
